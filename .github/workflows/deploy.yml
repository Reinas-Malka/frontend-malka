name: Deploy

# Publica el build en el bucket privado y invalida CloudFront (ADR 0011 del
# backend). Usa el mismo rol OIDC que el backend, con el sub de ESTE repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Las VITE_* se resuelven en BUILD, no en runtime: van como variables
      # del repo (ninguna es secreta; terminan en el bundle por diseno).
      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_REGION: ${{ vars.VITE_COGNITO_REGION }}
        run: npm run build

      - name: Credenciales temporales por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::961868442562:role/malka-suite-dev-github-actions
          aws-region: us-east-1

      - name: Publicar en S3
        run: |
          aws s3 sync dist/ "s3://malka-suite-dev-frontend-961868442562" --delete

      - name: Invalidar CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
